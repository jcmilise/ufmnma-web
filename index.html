<style>
/* =====================================================================
   Identidad visual: mezcla de tres referencias
   - Clínic Barcelona: azul marino institucional (#0D2C54, color de marca
     declarado en su web) + verde de acento; bloques editoriales alternos;
     pie oscuro de varias columnas; hilo de navegación.
   - NIH: franja institucional superior; "En las noticias" en tarjetas con
     imagen; cuadrícula "de un vistazo".
   - Johns Hopkins Internacional: hero oscuro a todo ancho con llamadas a la
     acción claras (pedir cita / derivar) y bloque de audiencias.
   Tipografía: Public Sans (titulares) + Atkinson Hyperlegible (texto,
   diseñada para baja visión).
   ===================================================================== */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --tint:#F6F9FC;
  --ink:#0A2540; --muted:#425466; --line:#E3E8EE;
  --hema:#0A2540;            /* azul marino profundo: titulares y texto */
  --hema-soft:#EEF0FB;
  --eosin:#5851E0;           /* violeta: enlaces y acentos de texto */
  --eosin-soft:#EEEDFF;
  --green-btn:#635BFF;       /* violeta: botones */
  --focus:#635BFF;
  --terra:#E64A8E; --peach:#FFC2D9; --fiber:#FFE9F1;   /* rosa: segundo acento (donativos, músculo) */
  --warm-soft:#FFF3F8; --warm-border:#FFC2D9;
  --ax1:#0A2540; --ax2:#635BFF; --ax2l:#9B95FF; --axfa:#FFE9F1; --axfb:#FFC9DC; --axwarm:#E64A8E; --axwarml:#FF86B5; --axcell:#A6F0FF; --axpulse:#80E9FF;
  --mosaic:#0A2540; --mosaicdot:#80E9FF;
  --aurora:radial-gradient(60% 80% at 10% 20%,rgba(255,122,89,.22),transparent 60%),radial-gradient(50% 70% at 60% 10%,rgba(255,207,96,.22),transparent 60%),radial-gradient(60% 70% at 95% 30%,rgba(128,233,255,.25),transparent 60%),radial-gradient(60% 80% at 50% 100%,rgba(99,91,255,.18),transparent 60%);
  --head:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1628; --surface:#112038; --surface-2:#15284A; --tint:#162B4D;
    --ink:#E9EEF6; --muted:#A8B4C8; --line:#26395A;
    --hema:#9DBDE8; --hema-soft:#1C3358; --eosin:#7FC8A6; --eosin-soft:#1B3A30;
    --green-btn:#3C9A72; --focus:#7FC8A6; --terra:#E08A6B; --peach:#FFD1BF; --fiber:#3A2620; --hero-a:#13264A; --hero-b:#0B1628;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1628; --surface:#112038; --surface-2:#15284A; --tint:#162B4D;
  --ink:#E9EEF6; --muted:#A8B4C8; --line:#26395A;
  --hema:#9DBDE8; --hema-soft:#1C3358; --eosin:#7FC8A6; --eosin-soft:#1B3A30;
  --green-btn:#3C9A72; --focus:#7FC8A6; --terra:#E08A6B; --peach:#FFD1BF; --fiber:#3A2620; --hero-a:#13264A; --hero-b:#0B1628;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--hema);text-underline-offset:.18em}
a:hover{color:var(--eosin)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:2px}
h1[tabindex="-1"]:focus,main:focus{outline:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 1.25rem}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.15;letter-spacing:-.015em;margin:0 0 .55em;color:var(--hema)}
h1{font-size:clamp(2rem,4.4vw,3.1rem)}
h2{font-size:clamp(1.5rem,2.6vw,2rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em;max-width:70ch}
.lead{font-size:1.2rem;color:var(--muted);max-width:62ch}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:.5rem 1rem;z-index:50}
.skip:focus{left:1rem}

/* ===== Franja institucional (NIH) ===== */
.topbar{background:var(--surface-2);color:var(--muted);font-size:.88rem;border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:36px;flex-wrap:wrap}
.topbar a{color:var(--muted)}
.lang{display:flex;gap:.2rem}
.lang button{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;padding:.05rem .5rem;border-radius:3px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:#fff}
:root[data-theme="dark"] .lang button[aria-pressed="true"]{color:#0B1628}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{color:#0B1628}}
.theme-btn{display:none}

/* ===== Cabecera blanca + barra de navegación azul ===== */
header.site{background:var(--surface);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0}
.brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:var(--ink)}
.brand-mark{height:70px;width:auto;flex:none;display:block;margin:-4px 0}
.brand-name{font-family:var(--head);font-weight:800;font-size:1.3rem;line-height:1.1;color:var(--hema);letter-spacing:-.01em}
.brand-sub{display:block;font-family:var(--sans);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:.2rem;letter-spacing:0}
.head-actions{display:flex;align-items:center;gap:.6rem}
.btn{display:inline-block;font:700 1rem/1.2 var(--head);padding:.75rem 1.2rem;border-radius:4px;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn-green{background:var(--green-btn);color:#fff}
.btn-green:hover{filter:brightness(.88);color:#fff}
.btn-ghost{border-color:currentColor;color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-navy{background:var(--hema);color:#fff}
.btn-navy:hover{filter:brightness(1.25);color:#fff}
:root[data-theme="dark"] .btn-navy{color:#0B1628}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-navy{color:#0B1628}}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;padding:.45rem .85rem;border-radius:4px;cursor:pointer}
.nav-row{background:var(--surface);border-top:1px solid var(--line)}
nav.main ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
nav.main a{display:block;padding:.8rem .6rem;text-decoration:none;color:var(--hema);font:600 .95rem/1.2 var(--head);border-bottom:3px solid transparent}
nav.main a:hover{background:var(--tint);color:var(--hema)}
nav.main a[aria-current="page"]{border-bottom-color:var(--green-btn)}
@media (max-width:960px){
  .menu-btn{display:block}
  .head-actions .btn{display:none}
  .nav-row{display:none}
  .nav-row.open{display:block}
  nav.main ul{flex-direction:column}
  nav.main a{border-bottom:0;border-left:3px solid transparent}
  nav.main a[aria-current="page"]{border-left-color:var(--green-btn)}
}

/* ===== Banner de portada a toda anchura (Johns Hopkins) ===== */
.banner{position:relative;min-height:clamp(300px,36vw,440px);display:grid;align-items:center;overflow:hidden;background:#1A0C24;color:#fff}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,24,.28) 0%,rgba(8,10,24,.08) 50%,rgba(8,10,24,0) 100%)}
.banner .wrap{position:relative;z-index:1;padding:2.5rem 1.25rem;width:100%}
.banner .panel{display:inline-block;max-width:640px;background:rgba(13,20,40,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-left:6px solid var(--peach);padding:1.6rem 2rem 1.7rem;border-radius:0 10px 10px 0}
.banner .kicker{font:800 1.6rem/1 var(--head);letter-spacing:.08em;color:#FFD1BF;margin:0 0 .6rem}
.banner h1{color:#fff;font-weight:600;letter-spacing:0;line-height:1.3;max-width:none;margin:0;font-size:clamp(1.2rem,2.1vw,1.6rem);text-shadow:none}
.banner .sub{color:#DCE3EF;margin:.8rem 0 0;font-size:1rem;max-width:52ch}
.banner .untr{background:rgba(255,255,255,.14)}

/* ===== Portada clara (Cleveland Clinic) con el mapa de la unidad ===== */
.hero{background:var(--bg);color:var(--ink);padding:2.5rem 0 3rem;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto -10% -40% auto;width:55%;height:120%;
  background:none;pointer-events:none}
.hero h1{max-width:19ch}
.hero .tagline{font:700 clamp(1.6rem,3vw,2.3rem)/1.2 var(--head);color:var(--hema);letter-spacing:-.015em;max-width:20ch;margin:0 0 .6em}
.hero .lead{color:var(--muted)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.axis-wrap{margin-top:2.25rem;overflow-x:auto;position:relative;z-index:1;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#FFFFFF 0%,var(--tint) 100%);box-shadow:0 12px 40px rgba(0,0,0,.06)}
.axis{display:block;width:100%;min-width:680px;height:auto}
.axis .zone{cursor:pointer}
.axis .zone .hit{fill:transparent}
.axis .zone:hover .stroke, .axis .zone.on .stroke, .axis .zone:focus-visible .stroke{stroke:var(--eosin)}
.axis .zone:hover .fillz, .axis .zone.on .fillz, .axis .zone:focus-visible .fillz{fill:var(--eosin);filter:url(#glowBig)}
.axis .zone:hover text, .axis .zone.on text{fill:var(--eosin)}
.axis .zone:focus{outline:none}
.axis .zone:focus-visible .hit{stroke:var(--focus);stroke-width:2;stroke-dasharray:4 3;rx:10}
.axis text{font:600 14px var(--head);fill:var(--hema);letter-spacing:.01em}
@media (prefers-reduced-motion: reduce){.axis .pulse{display:none}}
.axis-caption{font-size:.92rem;color:var(--muted);margin-top:.5rem}
.area-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem;margin-top:1.25rem;position:relative;z-index:1}
.area-index a{display:flex;gap:.75rem;align-items:center;padding:.65rem .85rem;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:.97rem;line-height:1.3}
.area-index a:hover,.area-index a.on{border-color:var(--eosin);background:var(--eosin-soft);color:var(--ink)}
.area-index .num{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--hema);color:#fff;font:700 .85rem var(--head);flex:none}
.area-index a.on .num,.area-index a:hover .num{background:var(--eosin)}

/* ===== Bloque de audiencias que monta sobre el hero (Hopkins) ===== */
.audience-wrap{margin-top:2.5rem;position:relative;z-index:2}
.audience{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.audience a{background:var(--surface);padding:1.4rem 1.4rem 1.25rem;text-decoration:none;color:var(--ink);display:block;
  border-radius:12px;box-shadow:0 8px 24px rgba(13,44,84,.10);border:1px solid var(--line);border-top:4px solid var(--green-btn)}
.audience .ic{width:40px;height:40px;border-radius:10px;background:var(--eosin-soft);color:var(--eosin);display:grid;place-items:center;margin-bottom:.8rem}
.audience .ic svg{width:22px;height:22px}
.audience a:hover{transform:translateY(-2px);color:var(--ink)}
.audience strong{display:block;font-family:var(--head);font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--hema)}
.audience span{color:var(--muted);font-size:.98rem}
@media (prefers-reduced-motion: no-preference){.audience a{transition:transform .15s ease}}

/* ===== Secciones genéricas ===== */
main{min-height:60vh}
.section{padding:3.25rem 0}
.section.alt{background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.section-head h2{margin:0}
.page-head{padding:2.25rem 0 2rem;background:var(--bg);border-bottom:1px solid var(--line)}
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:.75rem}
.crumbs a{color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem 3rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
.block{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.25rem 1.35rem}
.block h3{margin-bottom:.35em}
.block p{color:var(--muted);margin:0}
ul.plain{padding-left:1.1rem;margin:0 0 1rem}
ul.plain li{margin:.25rem 0}

/* ===== En las noticias (NIH) ===== */
.news-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.news-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.news-card .img{aspect-ratio:16/9;height:auto;background:var(--hema-soft);display:block}
.news-card .img svg{width:100%;height:100%;display:block}
.news-card .body{padding:1rem 1.15rem 1.25rem}
.news-card time{font-size:.88rem;color:var(--muted)}
.news-card h3{margin:.25rem 0 .4rem;font-size:1.12rem}
.news-card p{margin:0;color:var(--muted);font-size:.98rem}

/* ===== De un vistazo (NIH) ===== */
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.glance a{background:var(--surface);padding:1.4rem;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:.4rem}
.glance a:hover{background:var(--tint);color:var(--ink)}
.glance svg{width:34px;height:34px;color:var(--eosin)}
.glance strong{font-family:var(--head);color:var(--hema);font-size:1.08rem}
.glance span{color:var(--muted);font-size:.95rem}

@media (max-width:860px){.glance{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.glance{grid-template-columns:1fr}}
/* ===== Bloques editoriales alternos (Clínic podcast) ===== */
.feature{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:2.25rem;align-items:center;padding:2rem 0;border-bottom:1px solid var(--line)}
.feature:nth-child(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.feature:nth-child(even) .feature-media{order:2}
.feature-media{aspect-ratio:16/10;border-radius:8px;background:var(--hema);display:grid;place-items:center;position:relative;overflow:hidden}
.feature-media svg{width:100%;height:100%}
.feature h3{font-size:1.45rem}
.feature .meta{color:var(--muted);font-size:.95rem}
@media (max-width:760px){
  .feature,.feature:nth-child(even){grid-template-columns:1fr;gap:1rem}
  .feature:nth-child(even) .feature-media{order:0}
}

/* ===== Equipo ===== */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.person{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hema);border-radius:6px;padding:1rem 1.1rem}
.person.lead-p{border-left-color:var(--green-btn)}
.person .role{color:var(--muted);font-size:.95rem;margin:0}
.person .name{font-weight:700;margin:0 0 .2rem;font-family:var(--head);color:var(--ink)}
.people.with-photos{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}
.person.has-photo{padding:1rem 1rem 1.1rem;overflow:hidden;border-left-width:1px;border-top:1px solid var(--line);text-align:center}
.person.has-photo.lead-p{border-color:var(--green-btn)}
.person.has-photo img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.person.has-photo .txt{padding:.85rem 0 0}
.person.mini{display:flex;align-items:center;gap:.9rem;padding:.7rem .9rem}
.person.mini img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none}
.person.mini .txt p{margin:0}

/* ===== Varios ===== */
.callout{background:var(--tint);border-left:4px solid var(--hema);border-radius:4px;padding:1.1rem 1.3rem;max-width:72ch}
.callout p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:70ch}
.steps li{counter-increment:s;position:relative;padding:0 0 1.1rem 2.7rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--hema);color:#fff;display:grid;place-items:center;font:700 .95rem var(--head)}
.logos{display:flex;flex-wrap:wrap;gap:.75rem}
.logo-slot{border:1px solid var(--line);border-radius:4px;padding:.6rem 1rem;color:var(--muted);font-size:.92rem;background:var(--surface)}
.news-list{list-style:none;padding:0;margin:0}
.news-list li{display:grid;grid-template-columns:7.5rem 1fr;gap:1.25rem;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.news-list time{font-family:var(--head);color:var(--hema);font-weight:600}
.news-list h3{margin:0 0 .25rem;font-size:1.1rem}
.news-list p{margin:0;color:var(--muted)}
@media (max-width:560px){.news-list li{grid-template-columns:1fr;gap:.25rem}}
.stay{background:var(--hema-soft);border-radius:8px;padding:2rem;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap}
.stay h2{margin:0 0 .3rem}
.stay p{margin:0;color:var(--muted)}


/* ===== Espacio para profesionales ===== */
.pro-paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem}
.pro-paths .block{border-top:4px solid var(--hema)}
.redflags{background:#FFF4F4;border:1px solid #E7B7B7;border-left:5px solid #B3261E;border-radius:6px;padding:1.25rem 1.4rem}
.redflags h2{color:#8C1D18;font-size:1.35rem}
.redflags ul{margin:.25rem 0 .75rem;padding-left:1.2rem}
.redflags p{margin:0;font-weight:700;color:#5E1411}
:root[data-theme="dark"] .redflags{background:#2A1416;border-color:#6B2C2C}
:root[data-theme="dark"] .redflags h2,:root[data-theme="dark"] .redflags p{color:#FFB4AB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .redflags{background:#2A1416;border-color:#6B2C2C}
 :root:not([data-theme="light"]) .redflags h2,:root:not([data-theme="light"]) .redflags p{color:#FFB4AB}}
.ref-tool{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.5rem;box-shadow:0 6px 20px rgba(13,44,84,.07)}
.ref-tool fieldset{border:0;margin:0 0 1.5rem;padding:0}
.ref-tool legend{font:700 1.1rem var(--head);color:var(--hema);margin-bottom:.6rem;padding:0}
.ref-tool .step{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--hema);color:#fff;font-size:.9rem;margin-right:.5rem}
:root[data-theme="dark"] .ref-tool .step{color:#0B1628}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ref-tool .step{color:#0B1628}}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips-static span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;font-size:.95rem;background:var(--tint);color:var(--hema)}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;cursor:pointer;background:var(--surface);font-size:.97rem}
.chip input:checked + span{background:var(--hema);border-color:var(--hema);color:#fff}
:root[data-theme="dark"] .chip input:checked + span{color:#0B1628}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip input:checked + span{color:#0B1628}}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.35rem 1.5rem}
.checks label{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
.checks input{margin-top:.3rem;width:1.05rem;height:1.05rem;accent-color:var(--green-btn);flex:none}
.checks .sub{font-size:.85rem;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:.5rem}
.ref-alert{display:none;margin:0 0 1.25rem}
.ref-alert.show{display:block}
.ref-out{width:100%;min-height:15rem;font:0.95rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);resize:vertical}
.ref-actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
.ref-actions .ok{color:var(--eosin);font-weight:700}
.privacy-note{font-size:.92rem;color:var(--muted);margin-top:1rem}
.btn-outline-navy{border-color:var(--hema);color:var(--hema);background:transparent}
.btn-outline-navy:hover{background:var(--hema-soft);color:var(--hema)}


/* ===== Acreditaciones ===== */
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
.acc-card{display:grid;grid-template-columns:auto 1fr;gap:1.1rem;align-items:center;border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem;background:var(--surface)}
.acc-card .code{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--hema);color:#fff;font:800 1.15rem var(--head);letter-spacing:.03em;border:4px solid var(--eosin-soft);box-shadow:0 0 0 2px var(--eosin)}
.acc-card h3{margin:0 0 .15rem;font-size:1.05rem}
.acc-card p{margin:0;color:var(--muted);font-size:.95rem}
.acc-card .scope{color:var(--eosin);font-weight:700;margin-top:.3rem}

/* ===== Banda de donativos ===== */
.donate{margin-top:2.5rem;border:1px solid var(--warm-border);border-left:8px solid var(--terra);border-radius:14px;background:var(--warm-soft);padding:1.75rem 2rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.5rem;align-items:center}
.donate .ic{width:60px;height:60px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center}
.donate .ic svg{width:30px;height:30px}
.donate h2{margin:0 0 .3rem;font-size:1.4rem;color:var(--terra)}
.donate p{margin:0;color:var(--ink)}
.donate .btn{white-space:nowrap}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{filter:brightness(.88);color:#fff}
@media (max-width:760px){.donate{grid-template-columns:1fr;gap:1rem}}

/* ===== Ideas de Cleveland Clinic ===== */
/* Índice A-Z de enfermedades con buscador */
.az{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.5rem}
.az-search{width:100%;font:inherit;font-size:1.05rem;padding:.8rem 1rem;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.az-search:focus{border-color:var(--hema);outline:none}
.az-letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:1rem 0 .5rem}
.az-letters a{display:grid;place-items:center;min-width:2rem;height:2rem;border-radius:4px;text-decoration:none;font:700 .95rem var(--head);background:var(--tint);color:var(--hema)}
.az-letters a:hover{background:var(--hema);color:#fff}
.az-groups{columns:3 240px;column-gap:2rem;margin-top:1rem}
.az-group{break-inside:avoid;margin-bottom:1rem}
.az-group h3{font-size:1rem;color:var(--green-btn);margin:0 0 .3rem;border-bottom:1px solid var(--line);padding-bottom:.2rem}
.az-group ul{list-style:none;margin:0;padding:0}
.az-group li{margin:.2rem 0}
.az-group a{text-decoration:none}
.az-group a:hover{text-decoration:underline}
.az-group small{color:var(--muted);display:block;font-size:.82rem;line-height:1.3}
.az-empty{color:var(--muted);margin-top:1rem}
/* Por qué elegirnos */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:1.75rem 2.5rem}
@media (max-width:900px){.why{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.why{grid-template-columns:1fr}}
.why-item{display:grid;grid-template-columns:52px 1fr;gap:1rem;align-items:start}
.why-item .ic{width:52px;height:52px;border-radius:50%;background:var(--eosin-soft);color:var(--eosin);display:grid;place-items:center}
.why-item .ic svg{width:28px;height:28px}
.why-item h3{font-size:1.08rem;margin:0 0 .25rem}
.why-item p{margin:0;color:var(--muted);font-size:.98rem}
/* Primeros pasos */
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.start a{display:flex;gap:.9rem;align-items:center;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--hema);font:700 1.02rem/1.25 var(--head)}
.start a:hover{border-color:var(--hema);background:var(--tint)}
.start svg{width:30px;height:30px;color:var(--green-btn);flex:none}
/* Ficha de área con índice lateral fijo */
.area-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:3rem;align-items:start}
.toc{position:sticky;top:150px;border-left:3px solid var(--line);padding-left:1rem}
.toc p{font:700 .85rem var(--head);color:var(--muted);margin:0 0 .5rem;text-transform:none}
.toc ul{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:.3rem 0;text-decoration:none;color:var(--hema);font-size:.97rem}
.toc a:hover{color:var(--eosin)}
.area-sec{padding:0 0 2.25rem;margin-bottom:2.25rem;border-bottom:1px solid var(--line)}
.area-sec:last-child{border-bottom:0}
@media (max-width:860px){
  .area-layout{grid-template-columns:1fr;gap:1rem}
  .toc{position:static;border-left:0;padding:0;border-bottom:1px solid var(--line);padding-bottom:1rem}
  .toc ul{display:flex;flex-wrap:wrap;gap:.25rem 1rem}
}

/* ===== Pendientes / sin traducir ===== */
.tbd{background:#FCE7EE;color:#14213A;border-bottom:2px dashed #B8335F;padding:0 .25em;border-radius:2px}
.untr{border-bottom:2px dotted var(--hema);background:var(--hema-soft);padding:0 .2em;border-radius:2px}
.draft-chip{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:#14213A;color:#fff;font-size:.88rem;padding:.5rem .85rem;border-radius:999px;border:0;cursor:pointer;z-index:30;font-family:var(--sans);box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ===== Pie oscuro (Clínic) ===== */
footer.site{background:var(--surface-2);color:var(--muted);padding:3rem 0 0;font-size:.95rem;margin-top:0;border-top:1px solid var(--line)}
footer.site h3{font-size:1rem;color:var(--hema)}
footer.site a{color:var(--hema)}
footer.site a:hover{color:var(--eosin)}
.footer-logo{height:120px;width:auto;display:block;margin-bottom:.9rem}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2rem}
footer .legal-row{border-top:1px solid var(--line);margin-top:2.25rem;padding:1.1rem 0 3.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.88rem}
footer .tbd{color:#14213A}


/* ===== Estilo "aurora": píldoras, titular con degradado, luz de colores suave ===== */
.btn{border-radius:999px;padding:.8rem 1.35rem}
.hero{background:var(--aurora),#fff}
.hero .tagline{background:linear-gradient(90deg,#FF7A59 0%,#E64A8E 30%,#635BFF 65%,#0A2540 100%);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:22ch}
.axis-wrap{box-shadow:0 20px 60px rgba(99,91,255,.14)}
.audience a{border-radius:16px;border-top:1px solid var(--line);box-shadow:0 10px 30px rgba(10,37,64,.08)}
.audience .ic{border-radius:999px}
.donate{background:var(--aurora),#fff;border-left:0;border-radius:18px}
.donate h2{color:var(--hema)}
.donate .ic{background:#0A2540}
.area-index a,.glance,.acc-card,.block,.news-card,.start a{border-radius:14px}
.banner .panel{background:rgba(10,37,64,.78);border-left-color:#80E9FF}
.banner .kicker{color:#80E9FF}
nav.main a[aria-current="page"]{border-bottom-color:#635BFF}
.draft-chip{display:none !important}
</style>
</head>
<body>
<a class="skip" href="#view" id="skipLink"></a>

<div class="topbar">
  <div class="wrap">
    <span id="tbHospital"></span>
    <span style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <a id="tbDonate" style="font-weight:700;color:var(--terra)"></a>
      <a id="tbContact"></a>
      <button class="theme-btn" id="themeBtn" type="button"></button>
      <span class="lang" role="group" aria-label="Idioma / Language" id="langGroup">
        <button type="button" data-lang="es" lang="es" title="Castellano">ES</button>
        <button type="button" data-lang="ca" lang="ca" title="Català">CA</button>
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
      </span>
    </span>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <div class="head-row">
      <a class="brand" id="brandLink">
        <img class="brand-mark" id="brandLogo" alt="" width="40" height="64">
        <span class="brand-name">UF-MNMA<span class="brand-sub" id="brandSub"></span></span>
      </a>
      <div class="head-actions">
        <a class="btn btn-outline-navy" id="headerPro"></a>
        <a class="btn btn-green" id="headerCta"></a>
        <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="navRow"></button>
      </div>
    </div>
  </div>
  <div class="nav-row" id="navRow">
    <div class="wrap"><nav class="main" id="mainNav"><ul id="navList"></ul></nav></div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="site"><div class="wrap" id="footerInner"></div></footer>

<button class="draft-chip" id="draftChip" type="button"></button>

<script>
/* =====================================================================
   UF-MNMA · Web trilingüe (ES principal, CA y EN)
   ---------------------------------------------------------------------
   CÓMO EDITAR
   - Todo el texto está en CONTENT, TEAM, AREAS y NEWS.
   - E("texto")      → texto en castellano; huecos ca/en vacíos.
   - E("es","ca","en") → texto ya traducido.
   - P("texto")      → campo pendiente de completar (se marca en rosa).
   - Si falta la traducción, se muestra el castellano con subrayado punteado.
   ===================================================================== */
const LANGS = ["es","ca","en"];
const E = (es, ca="", en="") => ({es, ca, en});
const P = (es, ca="", en="") => ({es, ca, en, tbd:true});
let lang = "es";

/* Devuelve el texto en el idioma activo, con marcas de pendiente/sin traducir */
function L(v){
  if (v == null) return "";
  if (typeof v === "string") return v;            // texto neutro (nombres propios)
  let out = v[lang];
  if (!out){
    out = v.es;

/* -------- Ilustraciones provisionales (mosaico tipo corte transversal de músculo) -------- */
function mosaicSVG(seed, label){
  let x = seed * 9301 + 49297; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const cells = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 10; c++){
    const cx = c * 34 + (r % 2 ? 17 : 0) + rnd() * 6, cy = r * 30 + rnd() * 6, rr = 12 + rnd() * 5;
    const green = rnd() < 0.18;
    cells.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="${green ? "var(--mosaicdot)" : "#FFFFFF"}" fill-opacity="${green ? .7 : (.08 + rnd() * .12).toFixed(2)}"/>`);
  }
  return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}"><rect width="320" height="180" fill="var(--mosaic)"/>${cells.join("")}</svg>`;
}

/* Índice A-Z: se construye a partir de las enfermedades de cada área */
const fold = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function azItems(){
  return AREAS.flatMap(a => a.ex.filter(e => !e.tbd).map(e => ({ text: Lp(e), area: a })))
    .sort((x, y) => x.text.localeCompare(y.text, lang));
}
function azHTML(filter = ""){
  const q = fold(filter.trim());
  const items = azItems().filter(i => !q || fold(i.text).includes(q) || fold(Lp(i.area.name)).includes(q));
  if (!items.length) return `<p class="az-empty">${L(C.home.azEmpty)}</p>`;
  const groups = {};
  items.forEach(i => (groups[fold(i.text)[0].toUpperCase()] ||= []).push(i));
  return Object.keys(groups).sort().map(k => `<div class="az-group" id="az-${k}"><h3>${k}</h3><ul>${groups[k].map(i =>
    `<li><a href="${href("area/" + i.area.id)}">${i.text}</a><small>${L(i.area.name)}</small></li>`).join("")}</ul></div>`).join("");
}
function wireAZ(){
  const input = document.getElementById("azSearch"); if (!input) return;
  const box = document.getElementById("azGroups");
  input.addEventListener("input", () => { box.innerHTML = azHTML(input.value); });
  document.querySelectorAll(".az-letters a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); input.value = ""; box.innerHTML = azHTML("");
    const el = document.getElementById("az-" + a.dataset.l); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  }));
}

  }));
}

/* -------- Enrutador: #[ca|en/]ruta[/sub] -------- */
const view = document.getElementById("view");
function parseHash(){
  let parts = (location.hash || "#inicio").slice(1).split("/").filter(Boolean);
  let l = "es";
  if (LANGS.includes(parts[0])) l = parts.shift();
  return { l, key: parts[0] || "inicio", sub: parts[1] };
}
function render(){
  const { l, key, sub } = parseHash();
  lang = l;
  try { localStorage.setItem("ufmnma-lang", lang); } catch(e){}
  view.innerHTML = key === "area" ? areaPage(sub) : (PAGES[key] || PAGES.inicio)();
  const active = key === "area" ? "areas" : (PAGES[key] ? key : "inicio");
  renderChrome(active);
  document.getElementById("navRow").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  const h1 = view.querySelector("h1"); if (h1) h1.focus({preventScroll:true});
  wireAxis(); wireReferral(); wireAZ(); wireTOC(); updateDraftChip(); tbdCursor = -1;
}

/* Cambio de idioma conservando la página actual */
document.querySelectorAll("#langGroup button").forEach(b => b.addEventListener("click", () => {
  const { key, sub } = parseHash();
  const path = key + (sub ? "/" + sub : "");
  location.hash = (b.dataset.lang === "es" ? "" : b.dataset.lang + "/") + path;
}));


/* -------- Herramienta de preparación de derivaciones (100 % local) -------- */
function wireReferral(){
  const tool = document.getElementById("refTool"); if (!tool) return;
  const K = C.profesionales, O = K.out;
  const checksBox = tool.querySelector("#refChecks");
  const area = () => (tool.querySelector('input[name="refArea"]:checked') || {}).value || "none";

  function drawChecks(){
    const prev = new Set([...checksBox.querySelectorAll("input:checked")].map(i => i.dataset.key));
    const spec = area() !== "none" ? (K.area_items[area()] || []) : [];
    const row = (item, key) => `<label><input type="checkbox" data-key="${key}"${prev.has(key) ? " checked" : ""}><span>${L(item)}</span></label>`;
    checksBox.innerHTML =
      `<div class="sub">${L(K.common)}</div>` + K.common_items.map((it,i) => row(it, "c"+i)).join("") +
      (spec.length ? `<div class="sub">${L(K.specific)}</div>` + spec.map((it,i) => row(it, area()+i)).join("") : "");
  }
  function itemText(key){
    if (key[0] === "c" && /^c\d+$/.test(key)) return Lp(K.common_items[+key.slice(1)]);
    const id = key.replace(/\d+$/, ""), i = +key.match(/\d+$/)[0];
    return Lp(K.area_items[id][i]);
  }
  function build(){
    const boxes = [...checksBox.querySelectorAll("input")];
    const have = boxes.filter(b => b.checked).map(b => itemText(b.dataset.key));
    const miss = boxes.filter(b => !b.checked).map(b => itemText(b.dataset.key));
    const flags = [...tool.querySelectorAll("#refFlags input:checked")].map(b => Lp(K.red[+b.dataset.flag]));
    const a = area() === "none" ? Lp(K.unknown) : Lp(areaById(area()).name);
    tool.querySelector("#refAlert").classList.toggle("show", flags.length > 0);
    const list = arr => arr.length ? arr.map(x => "  - " + x).join("\n") : "  - " + Lp(O.none);
    tool.querySelector("#refOut").value =
      `${Lp(O.title)}\n\n${Lp(O.area)}: ${a}\n\n${Lp(O.have)}:\n${list(have)}\n\n${Lp(O.missing)}:\n${list(miss)}\n\n` +
      `${Lp(O.flags)}: ${flags.length ? "\n" + list(flags) + "\n  >> " + Lp(O.urgent) : Lp(O.none)}`;
    tool.querySelector("#refOk").textContent = "";
  }
  tool.addEventListener("change", e => { if (e.target.name === "refArea") drawChecks(); build(); });
  tool.querySelector("#refCopy").addEventListener("click", async () => {
    const ta = tool.querySelector("#refOut");
    try { await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.focus(); ta.select(); try { document.execCommand("copy"); } catch(_){} }
    tool.querySelector("#refOk").textContent = Lp(K.copied);
  });
  tool.querySelector("#refReset").addEventListener("click", () => {
    tool.querySelectorAll("input[type=checkbox]").forEach(i => i.checked = false);
    tool.querySelector('input[name="refArea"][value="none"]').checked = true;
    drawChecks(); build();
  });
  drawChecks(); build();
}

/* -------- Interacción del diagrama -------- */
function wireAxis(){
  const svg = view.querySelector(".axis"); if (!svg) return;
  const idx = view.querySelector("#areaIndex");
  const setOn = (zone, on) => {
    svg.querySelectorAll(`.zone[data-zone="${zone}"]`).forEach(z => z.classList.toggle("on", on));
    idx && idx.querySelectorAll(`a[data-zone="${zone}"]`).forEach(a => a.classList.toggle("on", on));
  };
  svg.querySelectorAll(".zone").forEach(z => {
    const zone = z.dataset.zone, go = () => location.hash = href("area/" + zoneToAreas[zone][0]).slice(1);
    z.addEventListener("mouseenter", () => setOn(zone, true));
    z.addEventListener("mouseleave", () => setOn(zone, false));
    z.addEventListener("focus", () => setOn(zone, true));
    z.addEventListener("blur", () => setOn(zone, false));
    z.addEventListener("click", go);
    z.addEventListener("keydown", e => { if (e.key==="Enter" || e.key===" "){ e.preventDefault(); go(); } });
  });
  idx && idx.querySelectorAll("a").forEach(a => {
    a.addEventListener("mouseenter", () => setOn(a.dataset.zone, true));
    a.addEventListener("mouseleave", () => setOn(a.dataset.zone, false));
  });
}

/* -------- Contador de pendientes / sin traducir -------- */
let tbdCursor = -1;
function updateDraftChip(){
  const n = document.querySelectorAll(".tbd").length;

  const chip = document.getElementById("draftChip");
  let txt = n ? Lp(C.ui.draftPending).replace("{n}", n) : Lp(C.ui.draftDone);
  if (lang !== "es" && u) txt += ", " + Lp(C.ui.draftUntr).replace("{n}", u);
  chip.textContent = txt;
}
document.getElementById("draftChip").addEventListener("click", () => {
  const list = [...document.querySelectorAll(".tbd, .untr")]; if (!list.length) return;
  tbdCursor = (tbdCursor + 1) % list.length;
  list[tbdCursor].scrollIntoView({ block:"center", behavior:"smooth" });
});

/* -------- Menú móvil -------- */
document.getElementById("menuBtn").addEventListener("click", e => {
  const row = document.getElementById("navRow"), open = !row.classList.contains("open");
  row.classList.toggle("open", open); e.currentTarget.setAttribute("aria-expanded", String(open));
});

/* -------- Tema claro/oscuro -------- */
const root = document.documentElement, themeBtn = document.getElementById("themeBtn");
function isDark(){ return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncThemeBtn(){ themeBtn.innerHTML = isDark() ? L(C.ui.light) : L(C.ui.dark); }
try { localStorage.removeItem("ufmnma-palette"); localStorage.removeItem("ufmnma-palette-v"); } catch(e){}
/* Modo oscuro desactivado: la web es siempre blanca */
try { localStorage.removeItem("ufmnma-theme"); } catch(e){}
root.dataset.theme = "light";
themeBtn.addEventListener("click", () => {
  root.dataset.theme = "light";
  syncThemeBtn();
});

/* Idioma recordado si se entra sin idioma en la URL */
try {
  const saved = localStorage.getItem("ufmnma-lang");
  if (!location.hash && saved && saved !== "es") location.replace("#" + saved + "/inicio");
} catch(e){}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
